{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Little Lemon{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'restaurant/style.css' %}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="{% url 'home' %}">🍋 Little Lemon</a>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book' %}">Book a table</a>
        <a href="{% url 'reservations' %}">Reservations JSON</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="site-footer">Little Lemon · Fresh food, warm hospitality</footer>
{% block scripts %}{% endblock %}
</body>
</html>
